name: Secret Scan

on:
  push:
  pull_request:

jobs:
  gitleaks:
    name: Gitleaks secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Gitleaks will exit 1 if secrets are found.
        # The intentionally-vulnerable app.js contains fake demo creds
        # (username 'admin', password 'password', token 'super-secret-token').
        # These are safe because they are clearly labelled as intentional
        # and only function inside the isolated lab network.
        # A .gitleaks.toml allowlist is used to suppress those specific patterns.

  basic-scan:
    name: Regex secret check (non-demo files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check non-demo files for obvious secrets
        run: |
          # Scan everything except known-intentional demo files
          if git grep -In \
              -e 'AWS_SECRET_ACCESS_KEY' \
              -e 'BEGIN RSA PRIVATE KEY' \
              -e 'BEGIN EC PRIVATE KEY' \
              -- \
              ':!infra/vuln-api/app.js' \
              ':!.env.example' \
              ':!challenges/' \
              ':!.github/workflows/secret-scan.yml'; then
            echo "ERROR: Potential real secrets found in non-demo files."
            exit 1
          fi
          echo "Secret regex check passed."
