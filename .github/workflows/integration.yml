name: Integration

on:
  push:
  pull_request:

jobs:
  integration-tests:
    name: Full stack integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate docker-compose.yml before starting
        run: docker compose config --quiet

      - name: Start full Docker Compose stack
        run: docker compose up -d --build

      - name: Wait for vuln-api to become healthy
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:4000/reflect?input=ok" >/dev/null 2>&1; then
              echo "vuln-api is up after ${i} attempts"
              break
            fi
            echo "waiting for vuln-api... attempt $i/30"
            sleep 4
          done
          # Final check — fail the job if still not responding
          curl -fsS "http://localhost:4000/reflect?input=healthcheck" || { echo "vuln-api never became healthy"; exit 1; }

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install vuln-api dependencies
        run: npm install --no-audit --no-fund
        working-directory: infra/vuln-api

      - name: Run vuln-api smoke tests
        run: npm --prefix infra/vuln-api test

      - name: Run lab health checks
        run: |
          chmod +x ./scripts/check_lab.sh
          ./scripts/check_lab.sh

      - name: Collect docker-compose logs on failure
        if: failure()
        run: docker compose logs --no-color > compose-logs.txt

      - name: Upload compose logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compose-logs
          path: compose-logs.txt

      - name: Tear down stack
        if: always()
        run: docker compose down -v
