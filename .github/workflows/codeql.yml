name: CodeQL

on:
  push:
  pull_request:
  schedule:
    - cron: "30 1 * * 1"  # weekly Monday 01:30 UTC

jobs:
  analyze:
    name: CodeQL analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript
          queries: security-extended

      - name: Autobuild
        uses: github/codeql-action/autobuild@v3

      - name: Run CodeQL analysis
        # continue-on-error: code scanning upload requires GitHub Advanced Security
        # (GHAS) on private repositories. The analysis runs and produces results;
        # the upload step may fail until GHAS is enabled — this does not indicate
        # a code quality regression.
        continue-on-error: true
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
