name: CI

on:
  push:
  pull_request:

jobs:
  node-smoke-tests:
    name: vuln-api smoke tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install vuln-api dependencies
        run: npm install --no-audit --no-fund
        working-directory: infra/vuln-api

      - name: Start vuln-api and run tests
        run: |
          node infra/vuln-api/app.js &
          sleep 2
          npm --prefix infra/vuln-api test

      - name: Start hardened API and run fixed tests
        run: |
          # Stop the vulnerable API so port 4000 is free for the hardened server.
          # Use an exact match to avoid also killing app_fixed.js.
          pkill -f "vuln-api/app\.js$" || true
          sleep 1
          SECURE_USER=testuser SECURE_PASS=testpass node infra/vuln-api/app_fixed.js &
          sleep 2
          node infra/vuln-api/test_fixed.js
